[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etr"
version = "0.1.0"
description = "Value-at-Risk and Expected Shortfall for energy futures positions"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pyarrow>=15",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "holidays>=0.62",
    "arch>=7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["etr"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
